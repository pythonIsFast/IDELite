name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Verify tag version
        run: test "${GITHUB_REF_NAME#v}" = "$(tr -d '[:space:]' < VERSION)"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Build PYZ and Debian package
        run: |
          python packaging/build_pyz.py
          packaging/build-deb.sh
      - name: Create checksums
        working-directory: dist
        run: sha256sum idelite-*.pyz idelite_*_all.deb > SHA256SUMS.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/idelite-*.pyz \
            dist/idelite_*_all.deb \
            dist/SHA256SUMS.txt \
            --title "IDELite ${GITHUB_REF_NAME#v}" \
            --generate-notes
